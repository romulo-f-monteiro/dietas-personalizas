<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="🍎 Seu Planejamento Alimentar">
    <meta property="og:description" content="Nutricionista Rômulo Monteiro: Clique para ver sua dieta detalhada.">
    
    <meta property="og:image" content="https://romulo-f-monteiro.github.io/dietas-personalizas_teste/assets/logo.png">
    
    <meta property="og:type" content="website">

    <title>Ver Dieta</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .cartao {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        h1 { color: #333; font-size: 20px; margin-top: 0; }
        p { color: #666; margin-bottom: 25px; }
        
        .botao {
            display: block;
            background-color: #2e7d32; /* Verde Nutrição */
            color: white;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .botao:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

    <div class="cartao">
        <h1>Olá!</h1>
        <p>Seu planejamento alimentar está pronto.</p>
        
        <a id="link-final" href="#" class="botao">
            Acessar Dieta ➔
        </a>
    </div>

    <script>
        // --- CONFIGURAÇÃO ATUALIZADA ---
        
        // 1. Pega os dados da URL (ex: ?nome=Maria...)
        const parametros = window.location.search;

        // 2. SEU NOVO SITE (Onde a dieta é calculada)
        const sitePrincipal = "https://romulo-f-monteiro.github.io/dietas-personalizas_teste/";

        // 3. Monta o link final
        if (parametros) {
            document.getElementById('link-final').href = sitePrincipal + parametros;
        } else {
            // Se abrir sem dados, vai para a capa do site
            document.getElementById('link-final').href = sitePrincipal;
        }
    </script>

</body>
</html>
