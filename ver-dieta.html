<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Seu Plano Alimentar Pronto</title>
    <meta property="og:title" content="🍎 Seu Plano Alimentar está pronto!">
    
    <meta property="og:description" content="Nutricionista Rômulo Monteiro: Clique para visualizar seu planejamento detalhado.">
    
    <meta property="og:image" content="https://romulo-f-monteiro.github.io/plano-alimentar/capa-whats.jpg">
    
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 90%;
            width: 350px;
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
        p { color: #6c757d; margin-bottom: 30px; font-size: 16px; }
        
        .btn {
            display: block;
            background-color: #28a745; /* Verde Sucesso */
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="saudacao">Olá!</h1>
        <p>Seu planejamento alimentar já está disponível para acesso.</p>
        
        <a id="botao-dieta" href="#" class="btn">
            Abrir Minha Dieta ➔
        </a>
    </div>

    <script>
        // Lógica para capturar o link antigo e redirecionar
        
        // 1. Pega tudo que vem depois do 'ver.html' (ex: ?nome=Marilene&d=xyz)
        const parametros = window.location.search;
        
        // 2. Define seu app principal (o index.html)
        // Como o arquivo ver.html está na mesma pasta, podemos usar apenas './'
        const linkAppPrincipal = "https://romulo-f-monteiro.github.io/plano-alimentar/";
        
        // 3. Monta o link final
        if (parametros) {
            // O botão vai levar para: .../plano-alimentar/?nome=Marilene...
            document.getElementById('botao-dieta').href = linkAppPrincipal + parametros;

            // Bônus: Pega o nome para personalizar
            const urlParams = new URLSearchParams(parametros);
            const nome = urlParams.get('nome');
            if(nome) {
                // Limpa o nome (tira os +) e pega o primeiro
                const primeiroNome = nome.replace(/\+/g, ' ').split(' ')[0];
                document.getElementById('saudacao').innerText = `Olá, ${primeiroNome}!`;
            }
        } else {
            // Se abrir sem link, volta pra home
            document.getElementById('botao-dieta').href = linkAppPrincipal;
            document.querySelector('p').innerText = "Acesse o app para gerar sua dieta.";
        }
    </script>

</body>
</html>
